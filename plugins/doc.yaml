apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: doc
spec:
  version: v0.2.1
  homepage: https://github.com/sttts/kubectl-doc
  shortDescription: Render Kubernetes API documentation
  description: |
    Render Kubernetes OpenAPI v3 schemas as YAML-shaped documentation for
    terminal, Markdown, HTML, and interactive documentation surfaces.

    kubectl doc can read schemas from a live cluster or from local CRD
    manifests. It supports YAML, Markdown, Kro SimpleSchema, HTML, browser,
    and terminal UI output formats.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/sttts/kubectl-doc/releases/download/v0.2.1/kubectl-doc-v0.2.1-linux-amd64.tar.gz
      sha256: feecb80203adde21b92d2d23a3d4a88e24bb6c7ebd65fccf5d6581c13e527c17
      files:
        - from: kubectl-doc-v0.2.1-linux-amd64/kubectl-doc
          to: .
        - from: kubectl-doc-v0.2.1-linux-amd64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/sttts/kubectl-doc/releases/download/v0.2.1/kubectl-doc-v0.2.1-linux-arm64.tar.gz
      sha256: c39b377769ba36efb97bd87089f321e9ea78e674b5f3582a2b2d5df57485a0e3
      files:
        - from: kubectl-doc-v0.2.1-linux-arm64/kubectl-doc
          to: .
        - from: kubectl-doc-v0.2.1-linux-arm64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/sttts/kubectl-doc/releases/download/v0.2.1/kubectl-doc-v0.2.1-darwin-amd64.tar.gz
      sha256: 41a6dccaf865ade245114ca0b9129054d6c8cbb73ef85ab2c385b1289cec4ef2
      files:
        - from: kubectl-doc-v0.2.1-darwin-amd64/kubectl-doc
          to: .
        - from: kubectl-doc-v0.2.1-darwin-amd64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/sttts/kubectl-doc/releases/download/v0.2.1/kubectl-doc-v0.2.1-darwin-arm64.tar.gz
      sha256: d03dbf68d13ed3e9e2ac4fc93d39b7616eede29ea25efe46faad388174f46160
      files:
        - from: kubectl-doc-v0.2.1-darwin-arm64/kubectl-doc
          to: .
        - from: kubectl-doc-v0.2.1-darwin-arm64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/sttts/kubectl-doc/releases/download/v0.2.1/kubectl-doc-v0.2.1-windows-amd64.zip
      sha256: 3bf6c902d4c5bfff2e70c9f61ee351cb4676eb66d8549fd6b8b705bf087c2aaa
      files:
        - from: kubectl-doc-v0.2.1-windows-amd64/kubectl-doc.exe
          to: .
        - from: kubectl-doc-v0.2.1-windows-amd64/LICENSE
          to: .
      bin: kubectl-doc.exe

    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/sttts/kubectl-doc/releases/download/v0.2.1/kubectl-doc-v0.2.1-windows-arm64.zip
      sha256: 9743d11072a494e6b88df8d799f57970ce1dbbad45f18ba0918c1bdcaf2e9e87
      files:
        - from: kubectl-doc-v0.2.1-windows-arm64/kubectl-doc.exe
          to: .
        - from: kubectl-doc-v0.2.1-windows-arm64/LICENSE
          to: .
      bin: kubectl-doc.exe
